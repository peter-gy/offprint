[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "offprint"
version = "0.0.1"
description = "Capture rendered web pages as verified self-contained artifacts"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/peter-gy/offprint"
Issues = "https://github.com/peter-gy/offprint/issues"
Documentation = "https://peter-gy.github.io/offprint/"

[project.scripts]
offprint = "offprint._cli:main"

[dependency-groups]
dev = [
  "maturin==1.15.0",
  "pyrefly==1.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
  "ty==0.0.78",
]

[tool.maturin]
manifest-path = "../../offprint-rs/python/Cargo.toml"
features = ["extension-module"]
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "THIRD_PARTY_NOTICES.txt", format = "sdist" },
]
module-name = "offprint._native"
python-source = "src"
strip = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/offprint/contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests", "examples", "scripts"]

[tool.ty.environment]
python-version = "3.10"
python-platform = "all"
extra-paths = ["src", "tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "src/**/*.pyi", "tests/**/*.py", "examples/**/*.py", "scripts/**/*.py"]
search-path = ["src", "tests"]
python-version = "3.10"
