[package]
name = "offprint-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
data-url = "0.3.2"
libfuzzer-sys = "0.4.10"
offprint-artifact = { path = "../crates/offprint-artifact" }
offprint-document = { path = "../crates/offprint-document" }
offprint-html = { path = "../crates/offprint-html" }
offprint-model = { path = "../crates/offprint-model" }
offprint-protocol = { path = "../crates/offprint-protocol" }
serde_json = "1.0.151"
url = "2.5.8"

[[bin]]
name = "collector_protocol"
path = "fuzz_targets/collector_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_arena"
path = "fuzz_targets/html_arena.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css_url_rewriting"
path = "fuzz_targets/css_url_rewriting.rs"
test = false
doc = false
bench = false

[[bin]]
name = "srcset"
path = "fuzz_targets/srcset.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_url"
path = "fuzz_targets/data_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mime"
path = "fuzz_targets/mime.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filename"
path = "fuzz_targets/filename.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resource_graph"
path = "fuzz_targets/resource_graph.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
