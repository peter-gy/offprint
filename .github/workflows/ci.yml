name: CI
"on":
  push:
    branches:
      - main
  pull_request: null
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install repository tools
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just,taplo-cli,cargo-deny,cargo-machete,cargo-semver-checks,cargo-about@0.9.2
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf "%s  %s\n" \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and repository contracts
        run: |
          just fmt-check
          just repo-check
          just workflow-check
      - name: Lint
        run: just lint
      - name: Test workspace
        run: just test
      - name: Check generated contracts
        run: just codegen-check
      - name: Check documentation
        run: just docs-check
      - name: Check dependencies
        run: just dependency-check
      - name: Check public API compatibility
        run: just semver-check
  collector:
    name: JavaScript workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just
      - name: Check collector
        run: just collector-check
      - name: Check shared JavaScript tooling
        run: pnpm run check
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-15
          - name: macOS x86-64
            os: macos-15-intel
          - name: Windows x86-64
            os: windows-2025
          - name: Windows arm64
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test native workspace
        run: cargo test --manifest-path offprint-rs/Cargo.toml --workspace --locked
      - name: Build release CLI
        run: cargo build --manifest-path offprint-rs/Cargo.toml --release --locked -p offprint-cli
  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just
      - name: Build and test binding
        run: just node-check
      - name: Build production addon
        run: pnpm --filter offprint run build
      - name: Install consumer Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Capture through installed npm package and CLI
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/offprint-node-package"
          install_dir="$RUNNER_TEMP/offprint-node-install"
          mkdir "$package_dir" "$install_dir"
          node scripts/package-license.mjs sync
          trap 'node "$GITHUB_WORKSPACE/sdk/node/scripts/package-license.mjs" clean' EXIT
          root_package="$package_dir/$(npm pack --ignore-scripts --silent --pack-destination "$package_dir")"
          node test/package-contents.mjs "$root_package" "$GITHUB_WORKSPACE/LICENSE" offprint-native.linux-x64-gnu.node
          cp test/package-smoke.mjs "$install_dir/smoke.mjs"
          cd "$install_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$root_package"
          node -e "if (!require('offprint').Offprint) process.exit(1)"
          node --input-type=module -e "import { Offprint } from 'offprint'; if (!Offprint) process.exit(1)"
          npm exec --offline -- offprint --version
          node smoke.mjs
        working-directory: sdk/node
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just
      - name: Build and test binding
        run: just python-check
      - name: Build wheel
        working-directory: sdk/python
        run: uv run --frozen maturin build --release --locked --out dist
      - name: Install wheel in a clean environment
        shell: bash
        working-directory: sdk/python
        run: |
          uv venv --python "${{ matrix.python }}" .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/python -c "import offprint; assert offprint.Offprint"
          .wheel-test/bin/python tests/wheel_smoke.py
          wheels=("$PWD"/dist/*.whl)
          test "${#wheels[@]}" = "1"
          uvx --from "${wheels[0]}" offprint --version
  windows-process-tracking:
    name: Windows process tracking
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Python test tools
        run: uv sync --directory sdk/python --frozen --no-install-project
      - name: Test Node.js process tracking
        run: pnpm --filter offprint exec vitest run test/process-tracking.test.js
      - name: Test Python process tracking
        working-directory: sdk/python
        run: uv run --frozen --no-sync pytest tests/test_process_tracking.py --tb=short
