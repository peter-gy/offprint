name: CI
"on":
  push:
    branches:
      - main
  pull_request: null
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  rust:
    name: Core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked contributor environment
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          locked: true
          activate-environment: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install workspace dependencies
        run: pixi run --locked setup
      - name: Check formatting and repository contracts
        run: |
          pixi run --locked just fmt-check
          pixi run --locked just repo-check
          pixi run --locked just workflow-check
      - name: Lint Rust
        run: pixi run --locked just lint
      - name: Test Rust workspace
        run: pixi run --locked just test
      - name: Check JavaScript workspace
        run: |
          pixi run --locked pnpm run lint
          pixi run --locked pnpm run typecheck
          pixi run --locked pnpm --filter @offprint/collector test
      - name: Check generated contracts
        run: pixi run --locked just codegen-check
  dev-environment:
    name: Contributor environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked contributor environment
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          locked: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check clean contributor setup
        run: pixi run --locked dev-check
      - name: Allow sandbox namespaces
        uses: ./.github/actions/setup-chromium
        with:
          install-libraries: "false"
      - name: Install pinned managed Chromium
        run: pixi run --locked browser-setup
      - name: Check native adapters
        run: |
          pixi run --locked just node-check
          pixi run --locked just python-check
      - name: Check managed browser capture and offline reopen
        run: pixi run --locked just test-fixture static-article
      - name: Audit browser process cleanup
        if: always()
        shell: bash
        run: |
          if pgrep -fl '([c]hrome|[C]hromium).*--remote-debugging-port'; then
            echo "Offprint Chromium process survived the contributor checks"
            exit 1
          fi
