name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target

      - name: Install repository tools
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just,taplo-cli,cargo-deny,cargo-machete,cargo-semver-checks,actionlint

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and repository contracts
        run: |
          just fmt-check
          just repo-check
          just workflow-check

      - name: Lint
        run: just lint

      - name: Test workspace
        run: just test

      - name: Check generated contracts
        run: just codegen-check

      - name: Check documentation
        run: just docs-check

      - name: Check dependencies
        run: just dependency-check

      - name: Check public API compatibility
        run: just semver-check

  collector:
    name: JavaScript workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just

      - name: Check collector
        run: just collector-check

      - name: Check shared JavaScript tooling
        run: pnpm run check

  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-15
          - name: macOS x86-64
            os: macos-15-intel
          - name: Windows x86-64
            os: windows-2025
          - name: Windows arm64
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target

      - name: Test native workspace
        run: cargo test --manifest-path offprint-rs/Cargo.toml --workspace --locked

      - name: Build release CLI
        run: cargo build --manifest-path offprint-rs/Cargo.toml --release --locked -p offprint-cli

  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxkbcommon0

      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just

      - name: Build and test binding
        run: just node-check

      - name: Build production addon
        run: pnpm --filter offprint run build

      - name: Install consumer Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Import ESM and CommonJS package surfaces
        working-directory: sdk/node
        run: |
          node -e "import('./index.js').then(m => { if (!m.Offprint) process.exit(1) })"
          node -e "if (!require('./index.cjs').Offprint) process.exit(1)"

      - name: Capture through Node.js runtime
        working-directory: sdk/node
        run: node test/package-smoke.mjs

      - name: Inspect npm package
        working-directory: sdk/node
        run: npm pack --dry-run

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: offprint-rs -> target

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just

      - name: Build and test binding
        run: just python-check

      - name: Build wheel
        working-directory: sdk/python
        run: uv run --frozen maturin build --release --out dist

      - name: Install wheel in a clean environment
        shell: bash
        working-directory: sdk/python
        run: |
          uv venv --python "${{ matrix.python }}" .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/python -c "import offprint; assert offprint.Offprint"
          .wheel-test/bin/python tests/wheel_smoke.py
