name: Publish
"on":
  push:
    tags:
      - v[0-9]*.[0-9]*.[0-9]*
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "315532800"
jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./sdk/node/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          if [[ "$version" == *-* ]]; then
            npm_tag=next
            prerelease=true
          else
            npm_tag=latest
            prerelease=false
          fi
          {
            echo "version=$version"
            echo "npm_tag=$npm_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Install repository tools
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just,taplo-cli,cargo-deny,cargo-machete,cargo-semver-checks
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf "%s  %s\n" \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory sdk/python --frozen
      - name: Verify signed release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(git rev-parse "$GITHUB_REF_NAME^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            --jq '.verification.verified')" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: just repo-check
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Run release gate
        run: just release-check
  browser-fixtures:
    name: Release fixtures ${{ matrix.group }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group:
          - artifact
          - browser-state
          - frames
          - lifecycle
          - network
          - resources
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Install pinned managed Chromium
        run: cargo run --manifest-path offprint-rs/Cargo.toml --locked -p offprint-cli -- browser install
      - name: Run fixture group
        run: cargo run --manifest-path offprint-rs/Cargo.toml --locked -p xtask -- e2e "${{ matrix.group }}"
      - name: Audit browser process cleanup
        if: always()
        run: |
          if pgrep -af '[c]hrome.*--remote-debugging-port'; then
            echo "Offprint Chromium process survived the fixture group"
            exit 1
          fi
      - name: Upload fixture failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-fixture-failure-${{ matrix.group }}
          path: |
            offprint-rs/target/benchmark-evidence
            offprint-rs/target/diagnostics
          if-no-files-found: ignore
          retention-days: 14
  browser-integrations:
    name: Release browser integrations
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Install pinned managed Chromium
        run: cargo run --manifest-path offprint-rs/Cargo.toml --locked -p offprint-cli -- browser install
      - name: Run ignored browser integration suites
        run: |
          cargo test --manifest-path offprint-rs/Cargo.toml --locked -p offprint \
            --test artifact_exports \
            --test diagnostics \
            --test capture_regressions \
            --test remote_browser \
            -- --ignored --test-threads=1
      - name: Audit browser process cleanup
        if: always()
        run: |
          if pgrep -af '[c]hrome.*--remote-debugging-port'; then
            echo "Offprint Chromium process survived the integration suites"
            exit 1
          fi
      - name: Upload integration failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-browser-integration-failure
          path: |
            offprint-rs/target/benchmark-evidence
            offprint-rs/target/diagnostics
          if-no-files-found: ignore
          retention-days: 14
  repeated-capture:
    name: Release repeated capture
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Install pinned managed Chromium
        run: cargo run --manifest-path offprint-rs/Cargo.toml --locked -p offprint-cli -- browser install
      - name: Run repeated capture suite
        run: cargo test --manifest-path offprint-rs/Cargo.toml --release --locked -p offprint repeated_capture -- --ignored --test-threads=1
      - name: Audit browser process cleanup
        if: always()
        run: |
          if pgrep -af '[c]hrome.*--remote-debugging-port'; then
            echo "Offprint Chromium process survived repeated capture"
            exit 1
          fi
      - name: Upload repeated-capture report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repeated-capture
          path: offprint-rs/target/benchmark-evidence/repeated-capture.json
          if-no-files-found: error
          retention-days: 30
  fuzz:
    name: Release fuzz smoke
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - name: Install fuzz tools
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just,cargo-fuzz
      - name: Run fuzz targets
        run: just fuzz-smoke 30
      - name: Upload fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-fuzz-failure
          path: |
            offprint-rs/fuzz/artifacts
            offprint-rs/fuzz/corpus
          if-no-files-found: ignore
          retention-days: 14
  miri:
    name: Release Miri
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: miri
      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just
      - name: Run Miri
        run: just miri
  sanitizer:
    name: Release address sanitizer
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1
      RUSTDOCFLAGS: "-Zsanitizer=address"
      RUSTFLAGS: "-Zsanitizer=address"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rust-src
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Test process ownership under AddressSanitizer
        run: |
          cargo +nightly test --manifest-path offprint-rs/Cargo.toml -Zbuild-std --locked \
            --target x86_64-unknown-linux-gnu \
            -p offprint-chromium --lib
      - name: Test native bindings under AddressSanitizer
        run: |
          cargo +nightly test --manifest-path offprint-rs/Cargo.toml -Zbuild-std --locked \
            --target x86_64-unknown-linux-gnu \
            -p offprint-node --lib --features napi-noop-in-unit-test
          cargo +nightly test --manifest-path offprint-rs/Cargo.toml -Zbuild-std --locked \
            --target x86_64-unknown-linux-gnu \
            -p offprint-python --lib
  native:
    name: Native ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: offprint
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: offprint
          - os: macos-15
            target: aarch64-apple-darwin
            executable: offprint
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: offprint.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
        if: runner.os == 'Linux'
      - name: Build natively
        run: cargo build --manifest-path offprint-rs/Cargo.toml --release --locked -p offprint-cli --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          cargo run --manifest-path offprint-rs/Cargo.toml --locked -p xtask -- package \
            --target "${{ matrix.target }}" \
            --binary "offprint-rs/target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            --output dist
      - name: Extract release archive
        shell: bash
        run: |
          mkdir release-smoke
          case "${{ matrix.target }}" in
            *windows*) unzip -q dist/*.zip -d release-smoke ;;
            *) tar -xzf dist/*.tar.gz -C release-smoke ;;
          esac
      - name: Verify release metadata
        shell: bash
        run: |
          metadata="$(find release-smoke -type f -name build-metadata.json -print -quit)"
          test -n "$metadata"
          cargo run --manifest-path offprint-rs/Cargo.toml --locked -p xtask -- verify-package-metadata \
            --metadata "$metadata" \
            --target "${{ matrix.target }}" \
            --source-revision "$GITHUB_SHA"
      - name: Capture through release archive
        shell: bash
        env:
          OFFPRINT_BROWSER_SOURCE: managed
          OFFPRINT_CACHE_DIR: ${{ runner.temp }}/offprint-release-managed-cache
        run: |
          binary="$(find "$GITHUB_WORKSPACE/release-smoke" -type f -name '${{ matrix.executable }}' -print -quit)"
          OFFPRINT_RELEASE_BINARY="$binary" \
            cargo test --manifest-path offprint-rs/Cargo.toml --locked -p offprint-cli --test release_archive_smoke \
              -- --ignored --test-threads=1
      - name: Upload native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  crates:
    name: Rust crate archives
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Install just
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: just
      - name: Package and verify Rust crates
        run: just crate-package dist/crates
      - name: Upload Rust crate archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-crates
          path: dist/crates/*.crate
          if-no-files-found: error
  node:
    name: Node addon ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: linux-x64-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            package: darwin-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            package: win32-x64-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
        if: runner.os == 'Linux'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native addon
        working-directory: sdk/node
        run: pnpm exec napi build --manifest-path ../../offprint-rs/node/Cargo.toml --output-dir . --platform --release --target ${{ matrix.target }} --no-js --dts native.d.ts -- --locked
        shell: bash
      - name: Capture through packed npm package
        shell: bash
        working-directory: sdk/node
        run: |
          package_dir="$RUNNER_TEMP/offprint-node-package"
          install_dir="$RUNNER_TEMP/offprint-node-install"
          mkdir "$package_dir" "$install_dir"
          node scripts/package-license.mjs sync
          trap 'node "$GITHUB_WORKSPACE/sdk/node/scripts/package-license.mjs" clean' EXIT
          npm pack --ignore-scripts --pack-destination "$package_dir"
          root_package="$(find "$package_dir" -maxdepth 1 -name 'offprint-[0-9]*.tgz' -print -quit)"
          test -n "$root_package"
          node test/package-contents.mjs \
            "$root_package" "$GITHUB_WORKSPACE/LICENSE" \
            "offprint-native.${{ matrix.package }}.node"
          cd "$install_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$root_package"
          cp "$GITHUB_WORKSPACE/sdk/node/test/package-smoke.mjs" smoke.mjs
          node smoke.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/lifecycle-child.mjs" lifecycle-child.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/lifecycle-processes.mjs" lifecycle-processes.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/lifecycle-runner.mjs" lifecycle-runner.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/package-lifecycle.mjs" package-lifecycle.mjs
          cp "$GITHUB_WORKSPACE/schemas/examples/capture-request.json" capture-request.json
          node package-lifecycle.mjs
      - name: Upload addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-${{ matrix.target }}
          path: sdk/node/offprint-native.${{ matrix.package }}.node
          if-no-files-found: error
  node-package:
    name: Assemble npm package
    needs: node
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Download native addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: node-*
          path: sdk/node
          merge-multiple: true
      - name: Pack and verify npm package
        shell: bash
        working-directory: sdk/node
        run: |
          test "$(find . -maxdepth 1 -name 'offprint-native.*.node' -type f | wc -l | tr -d ' ')" = "4"
          package_dir="$RUNNER_TEMP/offprint-node-package"
          install_dir="$RUNNER_TEMP/offprint-node-install"
          mkdir "$package_dir" "$install_dir"
          node scripts/package-license.mjs sync
          trap 'node "$GITHUB_WORKSPACE/sdk/node/scripts/package-license.mjs" clean' EXIT
          npm pack --ignore-scripts --pack-destination "$package_dir"
          package="$(find "$package_dir" -maxdepth 1 -name 'offprint-[0-9]*.tgz' -print -quit)"
          test -n "$package"
          node test/package-contents.mjs \
            "$package" "$GITHUB_WORKSPACE/LICENSE" \
            offprint-native.darwin-arm64.node \
            offprint-native.darwin-x64.node \
            offprint-native.linux-x64-gnu.node \
            offprint-native.win32-x64-msvc.node
          cd "$install_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$package"
          cp "$GITHUB_WORKSPACE/sdk/node/test/package-smoke.mjs" smoke.mjs
          node smoke.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/lifecycle-child.mjs" lifecycle-child.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/lifecycle-processes.mjs" lifecycle-processes.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/lifecycle-runner.mjs" lifecycle-runner.mjs
          cp "$GITHUB_WORKSPACE/sdk/node/test/package-lifecycle.mjs" package-lifecycle.mjs
          cp "$GITHUB_WORKSPACE/schemas/examples/capture-request.json" capture-request.json
          node package-lifecycle.mjs
      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-package
          path: ${{ runner.temp }}/offprint-node-package/offprint-*.tgz
          retention-days: 1
          if-no-files-found: error
  python:
    name: Python wheels ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.10
            sdist: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
            interpreter: python
            sdist: false
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
            interpreter: python
            sdist: false
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            interpreter: python
            sdist: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Build source distribution
        if: matrix.sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: "--out ../../dist"
          manylinux: "off"
          maturin-version: v1.15.0
          rust-toolchain: 1.97.0
          working-directory: sdk/python
      - name: Prepare locked source distribution
        if: matrix.sdist
        shell: bash
        run: |
          cargo fetch --manifest-path offprint-rs/Cargo.toml --locked
          python sdk/python/scripts/prepare_sdist.py dist/offprint-*.tar.gz
          mkdir dist/python-source
          tar -xzf dist/offprint-*.tar.gz -C dist/python-source --strip-components=1
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: "--release --locked --compatibility pypi -i ${{ matrix.interpreter }} --out ../../dist"
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.15.0
          rust-toolchain: 1.97.0
          working-directory: ${{ matrix.sdist && 'dist/python-source' || 'sdk/python' }}
      - name: Verify Python distribution contents
        shell: bash
        run: |
          shopt -s nullglob
          python sdk/python/tests/package_contents.py \
            "$GITHUB_WORKSPACE/LICENSE" dist/*.whl dist/*.tar.gz
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
        if: runner.os == 'Linux'
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv wheel-test
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin="wheel-test/Scripts/python.exe"
          else
            python_bin="wheel-test/bin/python"
          fi
          "$python_bin" -m pip install --disable-pip-version-check dist/*.whl
          "$python_bin" -c "import offprint; assert offprint.Offprint"
          "$python_bin" sdk/python/tests/wheel_smoke.py
          "$python_bin" sdk/python/tests/package_lifecycle.py
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload source distribution
        if: matrix.sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  supply-chain:
    name: Supply chain artifacts
    needs:
      - browser-fixtures
      - browser-integrations
      - fuzz
      - miri
      - native
      - node-package
      - python
      - repeated-capture
      - sanitizer
      - crates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      artifact-metadata: write
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - name: Install license report tool
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-deny
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release
          merge-multiple: true
      - name: Generate dependency license report
        run: |
          license_report="$(mktemp)"
          cargo deny --manifest-path offprint-rs/Cargo.toml list --format json --layout crate > "$license_report"
          test -s "$license_report"
          mv "$license_report" release/dependency-licenses.json
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: release
          format: spdx-json
          output-file: release/offprint.spdx.json
      - name: Generate release checksums
        working-directory: release
        run: |
          checksum_tmp="$(mktemp)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$checksum_tmp"
          mv "$checksum_tmp" SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-artifacts
          path: release/*
          retention-days: 1
          if-no-files-found: error
  publish-node:
    name: Publish npm package
    needs:
      - supply-chain
      - validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/offprint
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-package
          path: dist/npm
      - name: Configure npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish with npm trusted publishing
        env:
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          packages=(dist/npm/offprint-*.tgz)
          test "${#packages[@]}" = "1"
          published="$(npx --yes npm@11.12.1 view "offprint@$VERSION" version 2>/dev/null || true)"
          if [[ "$published" == "$VERSION" ]]; then
            local_integrity="sha512-$(openssl dgst -sha512 -binary "${packages[0]}" | openssl base64 -A)"
            published_integrity="$(npx --yes npm@11.12.1 view "offprint@$VERSION" dist.integrity)"
            if [[ "$published_integrity" != "$local_integrity" ]]; then
              echo "offprint@$VERSION exists with different package bytes" >&2
              exit 1
            fi
            echo "offprint@$VERSION is already published with matching bytes"
            tagged="$(npx --yes npm@11.12.1 view "offprint@$NPM_TAG" version 2>/dev/null || true)"
            if [[ "$tagged" != "$VERSION" ]]; then
              echo "npm dist-tag $NPM_TAG points to $tagged, expected $VERSION" >&2
              echo "trusted publishing cannot repair dist-tags outside npm publish" >&2
              exit 1
            fi
            exit 0
          fi
          npx --yes npm@11.12.1 publish \
            --access public \
            --tag "$NPM_TAG" \
            "${packages[0]}"
  publish-python:
    name: Publish Python distributions
    needs:
      - supply-chain
      - validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/offprint/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          version: 0.12.9
      - name: Check distribution set
        run: |
          test "$(find dist -name '*.whl' -type f | wc -l | tr -d ' ')" = "4"
          test "$(find dist -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = "1"
      - name: Publish with PyPI trusted publishing
        run: uv publish --check-url https://pypi.org/simple --trusted-publishing always dist/offprint-*.whl dist/offprint-*.tar.gz
  verify-node:
    name: Verify npm release
    needs:
      - publish-node
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Install and capture through npm release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          OFFPRINT_CACHE_DIR: ${{ runner.temp }}/offprint-npm-managed-cache
        run: |
          for attempt in {1..12}; do
            published="$(npx --yes npm@11.12.1 view "offprint@$VERSION" version 2>/dev/null || true)"
            if [[ "$published" == "$VERSION" ]]; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              exit 1
            fi
            sleep 5
          done
          test "$(npx --yes npm@11.12.1 view "offprint@$NPM_TAG" version)" = "$VERSION"
          install_dir="$RUNNER_TEMP/offprint-npm-install"
          mkdir "$install_dir"
          cd "$install_dir"
          npm init --yes >/dev/null
          npx --yes npm@11.12.1 install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "offprint@$VERSION"
          cp "$GITHUB_WORKSPACE/sdk/node/test/package-smoke.mjs" smoke.mjs
          node smoke.mjs
  verify-python:
    name: Verify PyPI release
    needs:
      - publish-python
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
          python-version: "3.14"
          version: 0.12.9
      - name: Set up Chromium runtime
        uses: ./.github/actions/setup-chromium
      - name: Install and capture through PyPI release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          OFFPRINT_CACHE_DIR: ${{ runner.temp }}/offprint-pypi-managed-cache
        run: |
          uv venv --python 3.14 release-venv
          for attempt in {1..12}; do
            if uv pip install \
              --python release-venv/bin/python \
              --no-cache \
              --only-binary offprint \
              --index-url https://pypi.org/simple \
              "offprint==$VERSION"
            then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              exit 1
            fi
            sleep 5
          done
          EXPECTED_VERSION="$VERSION" release-venv/bin/python - <<'PY'
          from importlib.metadata import version
          import os

          assert version("offprint") == os.environ["EXPECTED_VERSION"]
          PY
          release-venv/bin/python sdk/python/tests/wheel_smoke.py
          release-venv/bin/python sdk/python/tests/package_lifecycle.py
  release-notes:
    name: Publish GitHub release
    needs:
      - supply-chain
      - validate
      - verify-node
      - verify-python
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-artifacts
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          release_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --verify-tag "${release_args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes \
              --title "Offprint $GITHUB_REF_NAME" \
              --verify-tag \
              "${release_args[@]}"
          fi
