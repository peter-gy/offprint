name: Browser contracts

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "collector/**"
      - "crates/**"
      - "fixtures/**"
      - "justfile"
      - "rust-toolchain.toml"
      - "versions.toml"
      - "xtask/**"
      - ".github/workflows/browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fixtures:
    name: Fixtures ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group:
          - artifact
          - browser-state
          - frames
          - lifecycle
          - network
          - resources
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxkbcommon0

      - name: Install pinned managed Chromium
        shell: bash
        run: |
          mkdir -p target
          cargo run --locked -p offprint-cli -- browser install --json \
            > target/managed-browser.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("target/managed-browser.json", "utf8"));
            if (typeof result.browser?.executablePath !== "string") process.exit(1);
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              "OFFPRINT_BROWSER_PATH=" + result.browser.executablePath + "\n",
            );
          '

      - name: Run fixture group
        run: cargo run --locked -p xtask -- e2e "${{ matrix.group }}"

      - name: Audit browser process cleanup
        if: always()
        shell: bash
        run: |
          if pgrep -af '[c]hrome.*--remote-debugging-port'; then
            echo "Offprint Chromium process survived the fixture group"
            exit 1
          fi

      - name: Upload fixture failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-fixture-failure-${{ matrix.group }}
          path: |
            target/benchmark-evidence
            target/diagnostics
          if-no-files-found: ignore
          retention-days: 14

  integrations:
    name: Browser integration suites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxkbcommon0

      - name: Install pinned managed Chromium
        shell: bash
        run: |
          mkdir -p target
          cargo run --locked -p offprint-cli -- browser install --json \
            > target/managed-browser.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("target/managed-browser.json", "utf8"));
            if (typeof result.browser?.executablePath !== "string") process.exit(1);
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              "OFFPRINT_BROWSER_PATH=" + result.browser.executablePath + "\n",
            );
          '

      - name: Run ignored browser integration suites
        run: |
          cargo test --locked -p offprint \
            --test artifact_exports \
            --test diagnostics \
            --test capture_regressions \
            --test remote_browser \
            -- --ignored --test-threads=1

      - name: Audit browser process cleanup
        if: always()
        run: |
          if pgrep -af '[c]hrome.*--remote-debugging-port'; then
            echo "Offprint Chromium process survived the integration suites"
            exit 1
          fi

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-integration-failure
          path: |
            target/benchmark-evidence
            target/diagnostics
          if-no-files-found: ignore
          retention-days: 14

  platform-smoke:
    name: Browser smoke ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: macOS x86-64
            os: macos-15-intel
          - name: Windows x86-64
            os: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install pinned managed Chromium
        shell: bash
        run: |
          mkdir -p target
          cargo run --locked -p offprint-cli -- browser install --json \
            > target/managed-browser.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("target/managed-browser.json", "utf8"));
            if (typeof result.browser?.executablePath !== "string") process.exit(1);
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              "OFFPRINT_BROWSER_PATH=" + result.browser.executablePath + "\n",
            );
          '

      - name: Run managed browser smoke
        run: cargo test --locked -p offprint-chromium --test browser_smoke -- --ignored --test-threads=1

      - name: Run static capture fixture
        run: cargo run --locked -p xtask -- test-fixture static-article
