[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "offprint"
version = "0.1.0"
description = "Capture rendered web pages as verified self-contained artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/peter-gy/offprint"
Issues = "https://github.com/peter-gy/offprint/issues"

[dependency-groups]
dev = [
  "maturin>=1.14,<2",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
]

[tool.maturin]
features = ["extension-module"]
include = [
  { path = "LICENSE", format = "sdist" },
]
module-name = "offprint._native"
python-source = "python"
strip = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["offprint"]
mypy_path = "python"
